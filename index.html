<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flynn | Photographer</title>
    <style>
        /* BASE STYLES */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #FAFAFA; /* Very slight off-white for a premium feel */
            color: #111;
        }

        /* HEADER & NAVIGATION */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5vw;
            position: sticky;
            top: 0;
            background-color: rgba(250, 250, 250, 0.95);
            z-index: 100;
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 600;
        }

        nav a {
            text-decoration: none;
            color: #111;
            margin-left: 30px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #888;
        }

        /* MASONRY GALLERY GRID */
        .gallery-container {
            padding: 0 5vw 60px 5vw;
            /* Creates a 3-column masonry layout */
            column-count: 3;
            column-gap: 20px;
        }

        .gallery-item {
            margin-bottom: 20px;
            break-inside: avoid; /* Prevents photos from being split across columns */
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease, opacity 0.4s ease;
            cursor: pointer;
        }

        /* Slight zoom and fade effect when hovering over an image */
        .gallery-item:hover img {
            transform: scale(1.02);
            opacity: 0.85;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 900px) {
            .gallery-container {
                column-count: 2; /* Drops to 2 columns on tablets */
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                padding: 30px 20px;
                gap: 20px;
            }
            nav a {
                margin: 0 10px;
            }
            .gallery-container {
                column-count: 1; /* Drops to 1 column on phones */
                padding: 0 20px 40px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Alex Flynn</h1>
        <nav>
            <a href="index.html">Work</a>
            <a href="about.html">About</a>
            <a href="mailto:alexrobflynn@gmail.com">Contact</a>
            <a href="https://www.instagram.com/alex__flynn/" target="_blank">IG</a>
        </nav>
    </header>

    <div class="gallery-container">
        <!-- These are placeholder images. We will replace these with yours later! -->
        <div class="gallery-item"><img src="images/basketball_hoop.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/flip_flops.jpg" alt="Casual"></div>
        <div class="gallery-item"><img src="images/walsh_hiking.JPG" alt="Casual"></div>
        <div class="gallery-item"><img src="images/hay.jpg" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/clouds.jpg" alt="Portrait"></div>
        <div class="gallery-item"><img src="images/gian_beach.jpg" alt="Natural"></div>
        <div class="gallery-item"><img src="images/zeek_gig.jpg" alt="Live Music"></div>
        <div class="gallery-item"><img src="images/walsh.jpg" alt="Portraits"></div>
        <div class="gallery-item"><img src="images/paris.jpg" alt="Gallery"></div>
        <div class="gallery-item"><img src="images/sky_lights.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/zeek_headshot.jpg" alt="Casual"></div>
        <div class="gallery-item"><img src="images/rdm_collect.JPG" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/bball.JPG" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/ed_mx.jpg" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/fellas_laughing.JPG" alt="Commercial"></div>
    </div>

</body>
</html>
