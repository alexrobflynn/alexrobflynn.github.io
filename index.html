<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flynn | Photographer</title>
    <style>
        /* THEME VARIABLES */
        :root {
            --bg: #FAFAFA;
            --bg-header: rgba(250, 250, 250, 0.94);
            --lightbox-bg: rgba(250, 250, 250, 0.97);
            --text: #111111;
            --muted: #777777;
        }

        [data-theme="dark"] {
            --bg: #0D0D0D;
            --bg-header: rgba(13, 13, 13, 0.94);
            --lightbox-bg: rgba(13, 13, 13, 0.97);
            --text: #F2F2F2;
            --muted: #8A8A8A;
        }

        /* BASE STYLES */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        /* HEADER & NAVIGATION */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5vw;
            position: sticky;
            top: 0;
            background-color: var(--bg-header);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            transition: background-color 0.35s ease;
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 600;
        }

        h1 a {
            text-decoration: none;
            color: var(--text);
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            margin-left: 30px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--muted);
        }

        /* MINIMAL MONOCHROME THEME DOT */
        .theme-toggle {
            background: none;
            border: none;
            padding: 4px;
            margin-left: 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .theme-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: var(--text);
            transition: transform 0.25s ease, opacity 0.25s ease, background-color 0.35s ease;
        }

        .theme-toggle:hover .theme-dot {
            transform: scale(1.2);
            opacity: 0.7;
        }

        /* MASONRY GALLERY GRID */
        .gallery-container {
            padding: 0 5vw 80px 5vw;
            column-count: 3;
            column-gap: 20px;
        }

        /* SCROLL-TRIGGERED FADE-IN */
        .gallery-item {
            margin-bottom: 20px;
            break-inside: avoid;
            overflow: hidden;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .gallery-item.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item img {
            width: 100%;
            display: block;
            cursor: zoom-in;
            transition: opacity 0.35s ease, transform 0.45s ease;
        }

        /* FOCUS DIM ON HOVER (DESKTOP ONLY) */
        @media (hover: hover) {
            .gallery-container:has(.gallery-item:hover) .gallery-item:not(:hover) img {
                opacity: 0.38;
            }

            .gallery-item:hover img {
                transform: scale(1.015);
            }
        }

        /* FULLSCREEN LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background-color: var(--lightbox-bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 4vw;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, background-color 0.35s ease;
        }

        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .lightbox-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.25s ease;
        }

        .lightbox-close:hover {
            color: var(--muted);
        }

        .lightbox-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
            padding: 16px 48px;
        }

        .lightbox-stage img {
            max-width: 100%;
            max-height: 78vh;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-select: none;
            opacity: 0;
            transform: scale(0.985);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .lightbox.open .lightbox-stage img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.6rem;
            font-weight: 300;
            cursor: pointer;
            padding: 16px 12px;
            opacity: 0.55;
            transition: opacity 0.25s ease;
            user-select: none;
        }

        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-prev { left: 0; }
        .lightbox-next { right: 0; }

        .lightbox-caption {
            text-align: center;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            color: var(--muted);
            min-height: 1.2em;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 900px) {
            .gallery-container {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                padding: 28px 20px;
                gap: 18px;
            }
            nav a {
                margin: 0 10px;
            }
            .theme-toggle {
                margin-left: 12px;
            }
            .gallery-container {
                column-count: 1;
                padding: 0 20px 50px 20px;
            }
            .lightbox {
                padding: 20px;
            }
            .lightbox-stage {
                padding: 12px 0;
            }
            .lightbox-nav {
                display: none; /* Swipe left/right handles mobile navigation */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="index.html">Alex Flynn</a></h1>
        <nav>
            <a href="index.html">Work</a>
            <a href="about.html">About</a>
            <a href="mailto:alexrobflynn@gmail.com">Contact</a>
            <a href="https://instagram.com/alex__flynn" target="_blank">IG</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Darkmode">
                <span class="theme-dot"></span>
            </button>
        </nav>
    </header>

    <main class="gallery-container">
        <!-- PASTE YOUR EXISTING <div class="gallery-item"> LINES BELOW THIS LINE -->
        <!-- Optional: add data-caption="..." to any img to show a caption in the lightbox -->
        <div class="gallery-item"><img src="images/basketball_hoop.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/zeek_headshot.jpg" alt="Casual"></div>
        <div class="gallery-item"><img src="images/Difw1.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/Difw6.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/walsh_hiking.JPG" alt="Casual"></div>
        <div class="gallery-item"><img src="images/hay.jpg" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/gian_beach.jpg" alt="Natural"></div>
        <div class="gallery-item"><img src="images/zeek_gig.jpg" alt="Live Music"></div>
        <div class="gallery-item"><img src="images/flip_flops.jpg" alt="Casual"></div>
        <div class="gallery-item"><img src="images/Difw5.jpg" alt="Headshot" data-caption="London — Kodak Portra 400"></div>
        <div class="gallery-item"><img src="images/paris.jpg" alt="Gallery"></div>
        <div class="gallery-item"><img src="images/rdm_collect.JPG" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/sky_lights.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/Difw8.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/Difw3.jpg" alt="Headshot"></div>
        <div class="gallery-item"><img src="images/bball.JPG" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/ed_mx.jpg" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/fellas_laughing.JPG" alt="Commercial"></div>
        <div class="gallery-item"><img src="images/walsh.jpg" alt="Portraits"></div>
        <!-- END OF PHOTOS -->
    </main>

    <!-- FULLSCREEN LIGHTBOX -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <div class="lightbox-top">
            <span id="lightboxCounter">01 / 01</span>
            <button class="lightbox-close" id="lightboxClose" aria-label="Close">Close &times;</button>
        </div>
        <div class="lightbox-stage" id="lightboxStage">
            <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous photo">&#8592;</button>
            <img id="lightboxImg" src="" alt="">
            <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8594;</button>
        </div>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script>
        // 1. LIGHT / DARK CANVAS TOGGLE
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('portfolio-theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const nextTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('portfolio-theme', nextTheme);
        });

        // 2. SCROLL-TRIGGERED FADE-IN
        const galleryItems = document.querySelectorAll('.gallery-item');
        if ('IntersectionObserver' in window) {
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });

            galleryItems.forEach(item => revealObserver.observe(item));
        } else {
            galleryItems.forEach(item => item.classList.add('is-visible'));
        }

        // 3. FULLSCREEN LIGHTBOX
        const images = Array.from(document.querySelectorAll('.gallery-item img'));
        const lightbox = document.getElementById('lightbox');
        const lightboxStage = document.getElementById('lightboxStage');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const closeBtn = document.getElementById('lightboxClose');
        const prevBtn = document.getElementById('lightboxPrev');
        const nextBtn = document.getElementById('lightboxNext');

        let currentIndex = 0;
        let touchStartX = 0;

        function pad(num) {
            return String(num).padStart(2, '0');
        }

        function showPhoto(index) {
            currentIndex = (index + images.length) % images.length;
            const target = images[currentIndex];
            lightboxImg.classList.remove('loaded');
            lightboxImg.src = target.src;
            lightboxImg.alt = target.alt || '';
            lightboxCounter.textContent = `${pad(currentIndex + 1)} / ${pad(images.length)}`;
            lightboxCaption.textContent = target.dataset.caption || '';

            if (lightboxImg.complete) {
                requestAnimationFrame(() => lightboxImg.classList.add('loaded'));
            }
        }

        lightboxImg.addEventListener('load', () => {
            lightboxImg.classList.add('loaded');
        });

        function openLightbox(index) {
            showPhoto(index);
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        images.forEach((img, index) => {
            img.addEventListener('click', () => openLightbox(index));
        });

        closeBtn.addEventListener('click', closeLightbox);
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPhoto(currentIndex - 1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showPhoto(currentIndex + 1); });

        // Close when clicking empty space around the photo
        lightboxStage.addEventListener('click', (e) => {
            if (e.target === lightboxStage) closeLightbox();
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showPhoto(currentIndex + 1);
            if (e.key === 'ArrowLeft') showPhoto(currentIndex - 1);
        });

        // Mobile swipe controls
        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 40) {
                showPhoto(diff < 0 ? currentIndex + 1 : currentIndex - 1);
            }
        }, { passive: true });
    </script>

</body>
</html>
